[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "obdlink-can-collector"
version = "0.1.1"
description = "Passive OBDLink CAN collector for macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kaiwen Xu"}]
requires-python = ">=3.11"
dependencies = []
keywords = ["obdlink", "can-bus", "macos", "bluetooth", "data-collection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Swift",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/kevinxucs/obdlink-can-collector"
Repository = "https://github.com/kevinxucs/obdlink-can-collector"
Issues = "https://github.com/kevinxucs/obdlink-can-collector/issues"
Changelog = "https://github.com/kevinxucs/obdlink-can-collector/blob/main/CHANGELOG.md"

[project.scripts]
can-collect = "can_collector.cli:main"

[tool.setuptools]
packages = ["can_collector", "can_collector.native"]

[tool.setuptools.package-data]
can_collector = ["native/*.swift"]
