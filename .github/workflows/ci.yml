name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS / Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Bluetooth helper
        run: python -m can_collector build-bluetooth

  package:
    name: Package and installed CLI
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          forbidden = {"captures", "analysis", ".build", ".venv", "__pycache__"}
          for archive in Path("dist").iterdir():
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as package:
                      names = package.namelist()
              else:
                  with tarfile.open(archive) as package:
                      names = package.getnames()
              assert any(name.endswith("can_collector/native/BluetoothBridge.swift") for name in names), archive
              assert not any(forbidden.intersection(PurePosixPath(name).parts) for name in names), archive
              print(f"Verified {archive}")
          PY
      - name: Exercise installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/collector-smoke"
          "$RUNNER_TEMP/collector-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/collector-smoke/bin/can-collect" --help
          "$RUNNER_TEMP/collector-smoke/bin/can-collect" build-bluetooth
          "$RUNNER_TEMP/collector-smoke/bin/can-collect" demo --simulate-overflow --output "$RUNNER_TEMP/synthetic-session"
          "$RUNNER_TEMP/collector-smoke/bin/can-collect" inspect "$RUNNER_TEMP/synthetic-session"
